<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mini Social Media</title>

    <link rel="stylesheet" href="./css/feed.css" />
    <link rel="stylesheet" href="./css/home.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/toast.css">
    <link rel="stylesheet" href="./css/loading.css">
    <link rel="stylesheet" href="./css/theme.css">
  </head>

  <body>
    <header class="navbar">
      <div class="nav-left">
        <a href="feed.html" class="logo"> Mini Social Media </a>
      </div>

      <button id="menuToggle" class="menu-toggle">☰</button>

      <nav id="navMenu" class="nav-menu">
        <a href="feed.html"> Feed </a>

        <a href="profile.html"> Profile </a>

        <span id="username"> Guest </span>

        <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">🌙</button>

        <button id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main class="container">
      <!-- Create Post -->

      <section class="create-post">
        <textarea
          id="postContent"
          placeholder="What's on your mind?"
        ></textarea>

        <button id="createPostBtn">Create Post</button>
      </section>

      <!-- Posts -->

      <section id="postsContainer" class="posts-container"></section>
    </main>

    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/guard.js"></script>
    <script src="./js/postService.js"></script>
    <script src="./js/commentService.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/toast.js"></script>
    <script src="./js/loading.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/feed.js"></script>

    <script>
      RouteGuard.requireAuth();
    </script>
  </body>
</html>
